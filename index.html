<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lux — mon calendrier</title>
<meta name="description" content="Un petit calendrier mignon et pratique : rendez-vous, anniversaires, choses à faire.">
<meta name="theme-color" content="#2c3312">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Varela+Round&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<script>
  // Le theme avant l'affichage, pour ne pas clignoter.
  try { var t = localStorage.getItem('lux-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <header class="tete">
    <p class="marque"><span data-lux-petit></span>Lux</p>
    <div class="tete-actions">
      <button type="button" class="bouton-doux" data-aujourdhui>Aujourd’hui</button>
      <button type="button" class="bouton-rond" data-theme-bouton aria-label="Changer de thème" title="Changer de thème">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button type="button" class="bouton-rond" data-plus aria-label="Sauvegarde et options" title="Sauvegarde et options">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <main class="colonnes">
    <section class="mois" aria-label="Le mois">
      <div class="mois-tete">
        <button type="button" class="bouton-rond" data-mois-precedent aria-label="Mois précédent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <h1 aria-live="polite"><span data-titre-mois></span> <small data-titre-annee></small></h1>
        <button type="button" class="bouton-rond" data-mois-suivant aria-label="Mois suivant"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="semaine" aria-hidden="true"><span>lun</span><span>mar</span><span>mer</span><span>jeu</span><span>ven</span><span>sam</span><span>dim</span></div>
      <div class="grille" data-grille></div>
    </section>

    <aside class="cote" aria-label="Le jour choisi">
      <section class="carte jour">
        <h2 data-jour-titre></h2>
        <p class="ferie-nom" data-jour-ferie hidden></p>
        <div class="bulle"><span class="bulle-lux" data-lux-bulle></span><p data-jour-phrase aria-live="polite"></p></div>
        <div data-jour-evenements></div>
        <button type="button" class="bouton-plein" data-ajouter>+ Ajouter à ce jour</button>

        <h3>À faire</h3>
        <ul class="taches" data-taches></ul>
        <form class="tache-ajout" data-tache-form>
          <input name="t" maxlength="120" placeholder="Ajouter une chose à faire" aria-label="Ajouter une chose à faire" autocomplete="off">
          <button type="submit" aria-label="Ajouter">+</button>
        </form>
      </section>

      <section class="carte bientot">
        <h2>Bientôt</h2>
        <ul data-bientot></ul>
      </section>
    </aside>
  </main>
</div>

<dialog class="fenetre" data-fenetre-evenement aria-labelledby="titre-evenement">
  <form data-evenement method="dialog">
    <h2 id="titre-evenement" data-evenement-titre>Nouvel événement</h2>
    <label class="champ"><span>Quoi ?</span><input name="titre" maxlength="80" required placeholder="Dentiste, anniversaire de Léa…" autocomplete="off"></label>
    <div class="deux">
      <label class="champ"><span>Date</span><input name="date" type="date" required></label>
      <label class="champ"><span>Heure</span><input name="heure" type="time"></label>
    </div>
    <fieldset class="stickers"><legend>Sticker</legend><div data-stickers></div></fieldset>
    <label class="champ"><span>Revient</span>
      <select name="repete">
        <option value="non">Une seule fois</option>
        <option value="semaine">Chaque semaine</option>
        <option value="mois">Chaque mois</option>
        <option value="an">Chaque année</option>
      </select>
    </label>
    <label class="champ"><span>Note <small>(facultatif)</small></span><textarea name="note" rows="2" maxlength="400"></textarea></label>
    <div class="fenetre-actions">
      <button type="submit" class="bouton-plein" value="ok">Enregistrer</button>
      <button type="button" class="bouton-doux" data-fermer>Annuler</button>
      <button type="button" class="bouton-lien" data-supprimer hidden>Supprimer</button>
    </div>
  </form>
</dialog>

<dialog class="fenetre" data-fenetre-plus aria-labelledby="titre-plus">
  <h2 id="titre-plus">Sauvegarde et options</h2>
  <p class="aide">Votre calendrier reste sur cet appareil, dans ce navigateur. Sauvegardez-le de temps en temps pour ne rien perdre.</p>
  <div class="liste-actions">
    <button type="button" class="bouton-doux" data-sauvegarder>Télécharger une sauvegarde</button>
    <label class="bouton-doux bouton-fichier">Restaurer une sauvegarde<input type="file" accept="application/json,.json" data-restaurer></label>
    <button type="button" class="bouton-doux" data-ics>Exporter vers un autre agenda (.ics)</button>
    <button type="button" class="bouton-doux" data-imprimer>Imprimer ce mois</button>
  </div>
  <div class="fenetre-actions"><button type="button" class="bouton-plein" data-fermer>Fermer</button></div>
</dialog>

<p class="toast" role="status" aria-live="polite" data-toast></p>
<script src="app.js?v=2" defer></script>
</body>
</html>
